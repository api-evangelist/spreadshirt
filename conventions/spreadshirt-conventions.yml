  schema: ErrorResponse
  fields:
  - orderId
  - reason
  ref: errors/spreadshirt-problem-types.yml
webhooks:
  supported: true
  mechanism: subscriptions
  signature_header: X-SPRD-SIGNATURE
  signature: SHA256 HMAC, Base64-encoded
  ack: respond within 8 seconds with HTTP 202 and body "[accepted]"
