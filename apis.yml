- aid: spreadshirt:spreadshirt-authentication-api
  name: Spreadshirt Authentication API
  description: "The Spreadconnect API allows you to connect to the Spreadconnect system and lets you manage\
    \ your products, submit orders and get \nthem fulfilled via requests.\n\nTo make sure that the requests\
    \ send to the Spreadconnect API are indeed allowed to fetch and change your data in the Spreadconnect\
    \ \nsystem, \nthey first need to be authenticated.\nYou can authenticate your requests to the Spreadconnect\
    \ API by using your **Spreadconnect API Key**.  \n\n**How do I get my Spreadconnect API Key?**\n1.\
    \ **Login** into your account or register a new one at https://login.spreadconnect.app.\n2. Under\
    \ **\"Connect Integration\"** create a new Spreadconnect API Integration.\n3. The **Spreadconnect\
    \ API Key** for this Integration can be found on the **Dashboard** or at the **Integration Settings**\
    \ \npage. \n\n*For a more detailed explanation visit \nhttps://faq.spod.com/hc/en-us/articles/360020927339-How-do-I-get-started-with-the-API*\
    \  \n\nNow you can authenticate your requests by adding *X-SPOD-ACCESS-TOKEN* parameter with your\
    \ **Spreadconnect API Key** as \nthe value in the header of your request. \n\n*Example:*\n```\n  curl\
    \ 'https://api.spreadconnect.app/authentication' -H 'X-SPOD-ACCESS-TOKEN: {insert your Spreadconnect\
    \ API Key}'\n```\n\n**Always keep your Spreadconnect API Key private!**  \nAnyone who has your **Spreadconnect\
    \ API Key** can access and manipulate your Products, Orders, etc. that are managed by the\nAPI Integration\
    \ linked to this key.\nSo be careful not to share it."
  humanURL: https://api.spreadconnect.app/docs/
  baseURL: https://api.spreadconnect.app
