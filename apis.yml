- aid: spreadshirt:spreadshirt-product-types-api
  name: Spreadshirt Product Types API
  description: "Product types represent our available base products that can be used for customisation.\
    \ This information can also\nbe found in the User Interface of the Spreadconnect application when\
    \ creating a product. The main difference is that here \nonly the products which contain the enabled\
    \ print types are listed.\n\nAmong details as description and price, you will see in the response\
    \ payload the IDs \nnecessary for the creation payload when building the article variants: \"sizes\"\
    , \"appearances\" and \"views\". \n\nThe \"sizes\" and \"appearances\" represent the size and colour\
    \ attributes of the product\n\nThe \"views\" parameter represents the customizable areas of the product,\
    \ where you may choose to place a design on."
  humanURL: https://api.spreadconnect.app/docs/
  baseURL: https://api.spreadconnect.app
