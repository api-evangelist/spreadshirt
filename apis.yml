aid: spreadshirt
name: Spreadshirt
description: 'Spreadshirt (Spread Group) is a European print-on-demand and custom apparel
  platform that lets individuals and businesses design, sell, and order personalized T-shirts,
  hoodies, accessories, and merchandise. It exposes two developer surfaces: the SpreadConnect
  (SPOD) fulfillment REST API, which connects any shop system to on-demand production and
  drop-shipping (articles, orders, product types, stock, designs, and webhook subscriptions),
  and the older Spreadshirt Public Shop API for building custom storefronts against the
  EU and North American marketplaces. Added to the API Evangelist network as a consumer /
  print-on-demand provider and enriched by the pipeline.'
